stages:
  - test
  - build
  - dockerize
  - openshift_redeploy

unit_tests:
  stage: test
  image: timbru31/node-chrome:fermium
  before_script:
    - npm install -g @angular/cli
    - npm install -g npm@latest
  script:
    - npm ci
    - npm run build
    - npm run test:ci

build_website:
  stage: build
  only:
    - tags
  except:
    - branches
  image: node:fermium-bullseye
  before_script:
    - npm install -g @angular/cli
    - npm install -g npm@latest
  script:
    - npm ci
    - export VERSION=$CI_COMMIT_TAG
    - node -p "let data = require('./package.json'); data.version='$VERSION'; JSON.stringify(data, null, 2)" > package_version.json
    - mv package_version.json package.json
    - npm run build
    - cp .htaccess ./dist/
  artifacts:
    paths:
      - dist/

build_docker:
  stage: dockerize
  only:
    - tags
  except:
    - branches
  needs:
    - job: build_website
      artifacts: true
  tags: 
    - docker-privileged
  image: docker:19.03.1
  services:
    - docker:19.03.1-dind
  variables:
      DOCKER_TLS_CERTDIR: "/certs"
      CONTAINER_VERSION_IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_TAG
      CONTAINER_LATEST_IMAGE: $CI_REGISTRY_IMAGE:latest
  before_script:
   - docker info
   - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
  script:
   - docker build --pull -f Dockerfile -t $CONTAINER_VERSION_IMAGE .
   - docker push $CONTAINER_VERSION_IMAGE
   - docker tag $CONTAINER_VERSION_IMAGE $CONTAINER_LATEST_IMAGE
   - docker push $CONTAINER_LATEST_IMAGE

update_imagestream_and_redeploy:
  stage: openshift_redeploy
  only:
    - tags
  except:
    - branches
  needs:
    - job: build_docker
      artifacts: false
  image: gitlab-registry.cern.ch/paas-tools/openshift-client:latest
  environment:
    name: production
    url: https://masterclass-test-alice.web.cern.ch/
  script:
    - "oc import-image $APP_NAME --all --server=$SERVER --namespace $NAMESPACE --token=$IMAGE_IMPORT_TOKEN"
    - "sleep 30s && oc rollout status dc/$APP_NAME --server=$SERVER --namespace $NAMESPACE --token=$IMAGE_IMPORT_TOKEN"
  variables:
    SERVER: https://api.paas.okd.cern.ch
    APP_NAME: alice-masterclass-teacher
