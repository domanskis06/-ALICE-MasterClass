stages:
  - convert
  - test
  - build_apps
  - build_website
  - dockerize
  - openshift_redeploy

convert_strangeness_events:
  stage: convert
  image: rootproject/root:6.22.08-ubuntu20.04
  script:
    - root -b -q "./data/strangeness/part1/convert_events.C(\"./data/strangeness/part1/events\", \"./src/assets/exercises/strangeness/part1\")"
  artifacts:
    paths:
      - src/assets/exercises/strangeness/part1

convert_strangeness_invariant:
  stage: convert
  image: python:3.6.13-alpine3.13
  script:
    - python3 ./data/strangeness/part2/convert.py ./data/strangeness/part2/ ./src/assets/exercises/strangeness/part2
  artifacts:
    paths:
      - src/assets/exercises/strangeness/part2

.convert_strangeness_invariant_hints:
  stage: convert
  when: manual
  image: rootproject/root:6.22.08-ubuntu20.04
  script:
    - root -b -q "./data/strangeness/part2/generate_hints.C(\"./data/strangeness/part2/InvariantMass.root\", \"./src/assets/exercises/strangeness/part2\")"
  artifacts:
    paths:
      - src/assets/exercises/strangeness/part2

