stages:
  - convert
  - test
  - build_website
  - dockerize
  - openshift_redeploy

convert_strangeness_events:
  stage: convert
  image: rootproject/root:6.22.08-ubuntu20.04
  script:
    - root -b -q "./data/strangeness/part1/convert_events.C(\"./data/strangeness/part1/events\", \"./src/assets/exercises/strangeness/part1\")"
  artifacts:
    paths:
      - src/assets/exercises/strangeness/part1

convert_strangeness_invariant:
  stage: convert
  image: python:3.6.13-alpine3.13
  script:
    - python3 ./data/strangeness/part2/convert.py ./data/strangeness/part2/ ./src/assets/exercises/strangeness/part2
  artifacts:
    paths:
      - src/assets/exercises/strangeness/part2

.convert_strangeness_invariant_hints:
  stage: convert
  when: manual
  image: rootproject/root:6.22.08-ubuntu20.04
  script:
    - root -b -q "./data/strangeness/part2/generate_hints.C(\"./data/strangeness/part2/InvariantMass.root\", \"./src/assets/exercises/strangeness/part2\")"
  artifacts:
    paths:
      - src/assets/exercises/strangeness/part2

unit_tests:
  stage: test
  needs:
  - job: convert_strangeness_events
    artifacts: true
  - job: convert_strangeness_invariant
    artifacts: true
  image: node:22-bookworm
  variables:
    CHROME_BIN: "/usr/bin/chromium"
  before_script:
    - apt-get update && apt-get install -y chromium
    - npm install -g @angular/cli@21.0.0
  script:
    - npm ci
    - npm run build
    - npm run test:ci

e2e_playwright:
  stage: test
  allow_failure: true
  needs:
    - job: convert_strangeness_events
      artifacts: true
    - job: convert_strangeness_invariant
      artifacts: true
  image: mcr.microsoft.com/playwright:v1.59.1-noble
  variables:
    CI: "true"
  before_script:
    - npm install -g @angular/cli@21.0.0
    - apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y python3 python3-venv python3-pip
    - python3 -m venv .venv-e2e-django
    - . .venv-e2e-django/bin/activate && pip install -r ../alice-masterclass-django/requirements.txt
  script:
    - |
      . .venv-e2e-django/bin/activate
      export E2E_PYTHON="$(command -v python)"
      npm ci
      npm run e2e:django

build_website:
  stage: build_website
  only:
    - tags
  except:
    - branches
  needs:
    - job: convert_strangeness_events
      artifacts: true
    - job: convert_strangeness_invariant
      artifacts: true
  image: node:22-bookworm
  before_script:
    - npm install -g @angular/cli@21.0.0
  script:
    - npm ci
    - export VERSION=$CI_COMMIT_TAG
    - node -p "let data = require('./package.json'); data.version='$VERSION'; JSON.stringify(data, null, 2)" > package_version.json
    - mv package_version.json package.json
    - npm run build:prod
    - cp .htaccess ./dist/
  artifacts:
    paths:
      - dist/

build_docker:
  stage: dockerize
  only:
    - tags
  except:
    - branches
  needs:
    - job: build_website
      artifacts: true
  tags: 
    - docker-privileged
  image: docker:19.03.1
  services:
    - docker:19.03.1-dind
  variables:
      DOCKER_TLS_CERTDIR: "/certs"
      CONTAINER_VERSION_IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_TAG
      CONTAINER_LATEST_IMAGE: $CI_REGISTRY_IMAGE:latest
  before_script:
   - docker info
   - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
  script:
   - docker build --pull -f Dockerfile -t $CONTAINER_VERSION_IMAGE .
   - docker push $CONTAINER_VERSION_IMAGE
   - docker tag $CONTAINER_VERSION_IMAGE $CONTAINER_LATEST_IMAGE
   - docker push $CONTAINER_LATEST_IMAGE

update_imagestream_and_redeploy:
  stage: openshift_redeploy
  only:
    - tags
  except:
    - branches
  needs:
    - job: build_docker
      artifacts: false
  image: gitlab-registry.cern.ch/paas-tools/openshift-client:latest
  environment:
    name: production
    url: https://masterclass-test-alice.web.cern.ch/
  script:
  - "oc import-image $APP_NAME --all --server=$SERVER --namespace $NAMESPACE --token=$IMAGE_IMPORT_TOKEN"
  - "sleep 30s && oc rollout status dc/$APP_NAME --server=$SERVER --namespace $NAMESPACE --token=$IMAGE_IMPORT_TOKEN"
  variables:
    SERVER: https://api.paas.okd.cern.ch
    APP_NAME: alice-masterclass
