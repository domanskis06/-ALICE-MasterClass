<mat-dialog-content>
  <p> {{ 'SELECT_DATASET_DIALOG.TEXT' | translate }} </p>
  <form [formGroup]="datasetForm">
    <mat-form-field appearance="fill">
      <mat-label>{{ 'SELECT_DATASET_DIALOG.DATASET' | translate }}</mat-label>
      <mat-select formControlName="dataset">
        @if (data.hasDemo) {
          <mat-option [value]="demoValue">{{ 'SELECT_DATASET_DIALOG.DEMO' | translate }}</mat-option>
        }
        @for (dataset of data.dataset; track dataset) {
          <mat-option [value]="dataset">
            <span [translate]="'SELECT_DATASET_DIALOG.DATASET_VAL'" [translateParams]="{dataset: dataset - 1}"></span>
          </mat-option>
        }
        @if (data.hasFull) {
          <mat-option [value]="fullEventValue">{{ 'SELECT_DATASET_DIALOG.FULL_EVENT' | translate }}</mat-option>
        }
      </mat-select>
    </mat-form-field>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="center">
  <app-spinner-container [loading]="loading">
    <button mat-raised-button color="primary" [disabled]="loading || datasetForm.invalid" (click)="onProceedClick()"> {{ 'SELECT_DATASET_DIALOG.BUTTON_PROCEED' | translate }}</button>
  </app-spinner-container>
</mat-dialog-actions>
